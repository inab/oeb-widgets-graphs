title: OEB-Widgets-Graphs | A graph collection made by OEB services
version: "1.2.0"
demo_revision: "bd3a1e3cd45e41e7f4472469aeadbfa28f122f2f"
description: >- # this means to ignore newlines until "baseurl:"
  Interactive benchmarking charts and examples from OpenEBench.
baseurl: "/oeb-widgets-graphs" # the subpath of your site, e.g. /blog
url: "https://inab.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  Androidbeingx
#baseurl: /oeb-widgets-graphs/docs
#url: https://inab.github.io
#root: /oeb-widgets-graphs/docs
# Build settings
theme: minima
plugins:
  - jekyll-feed

include:
  - _examples

